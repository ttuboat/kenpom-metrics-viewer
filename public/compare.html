<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Teams - KenPom</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation */
        .nav-container {
            max-width: 1400px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .nav-links a.active {
            background: #764ba2;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .season-selector {
            margin-bottom: 20px;
        }

        .team-selectors {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }

        .team-group {
            border: 2px solid #e0e0e0;
            padding: 20px;
            border-radius: 8px;
        }

        .team-group h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #333;
        }

        .secondary-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .secondary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn.active {
            background: #764ba2;
            color: white;
        }

        .help-text {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        .results-container {
            display: none;
        }

        .results-container.active {
            display: block;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .chart-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-card h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 400px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .loading.active {
            display: block;
        }

        .error {
            display: none;
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .error.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .nav-container {
                padding: 15px;
            }

            .nav-title {
                font-size: 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                padding: 8px 15px;
                font-size: 14px;
            }

            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .controls {
                padding: 15px;
            }

            .team-selectors {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .team-group {
                padding: 15px;
            }
            
            .chart-container {
                height: 300px;
            }

            .chart-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-container">
        <div class="nav-title">
            🏀 KenPom Metrics Viewer
        </div>
        <div class="nav-links">
            <a href="index.html">Season Trends</a>
            <a href="compare.html" class="active">Compare Teams</a>
            <a href="matchup.html">Matchup Builder</a>

    <div class="container">
        <h1>🏀 Compare Teams - KenPom</h1>
        
        <div class="controls">
            <div class="season-selector">
                <div class="form-group">
                    <label for="yearSelect">Select Season:</label>
                    <select id="yearSelect">
                        <option value="">Choose a season...</option>
                    </select>
                </div>
            </div>

            <div class="team-selectors">
                <div class="team-group">
                    <h3>Team 1</h3>
                    <div class="form-group">
                        <label for="team1Select">Select Team:</label>
                        <select id="team1Select">
                            <option value="">Choose a team...</option>
                        </select>
                    </div>
                </div>

                <div class="team-group">
                    <h3>Team 2</h3>
                    <div class="form-group">
                        <label for="team2Select">Select Team:</label>
                        <select id="team2Select">
                            <option value="">Choose a team...</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="button-group">
                <button id="compareBtn" class="primary-btn">Compare Teams</button>
                <button id="toggleBtn" class="secondary-btn" disabled>Show Rankings</button>
            </div>

            <p class="help-text">
                Select two teams and a season to compare their KenPom metrics throughout the year.
            </p>

            <div id="errorMessage" class="error"></div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading comparison data...</p>
        </div>

        <div id="resultsContainer" class="results-container">
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Adjusted Offense</h3>
                    <div class="chart-container">
                        <canvas id="offenseChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>Adjusted Defense</h3>
                    <div class="chart-container">
                        <canvas id="defenseChart"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>Net Rating</h3>
                    <div class="chart-container">
                        <canvas id="netRatingChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

            'Stetson', 'Stonehill', 'Stony Brook', 'Syracuse', 'Tarleton St.', 'TCU',

            'Texas', 'Texas A&M', 'Texas A&M Commerce', 'Texas A&M Corpus Chris', 'Texas Arlington', 
            'Texas Rio Grande Valley', 'Texas San Antonio', 'Texas Southern', 'Texas St.', 
            'Texas Tech', 'The Citadel', 'Toledo', 'Towson', 'Troy', 'Tulane', 'Tulsa', 
            'UAB', 'UCF', 'UCLA', 'UMass Lowell', 'UMBC', 'UNC Asheville', 'UNC Greensboro', 
            'UNC Wilmington', 'UNLV', 'USC', 'UT Martin', 'Utah', 'Utah St.', 'Utah Tech', 
            'Utah Valley', 'UTEP', 'Valparaiso', 'Vanderbilt', 'VCU', 'Vermont', 'Villanova', 
            'Virginia', 'Virginia Tech', 'VMI', 'Wagner', 'Wake Forest', 'Washington', 
            'Washington St.', 'Weber St.', 'West Virginia', 'Western Carolina', 'Western Illinois', 
            'Western Kentucky', 'Western Michigan', 'Wichita St.', 'William & Mary', 'Winthrop', 
            'Wisconsin', 'Wofford', 'Wright St.', 'Wyoming', 'Xavier', 'Yale', 'Youngstown St.'
        ];

        let charts = {};
        let currentData = null;
        let showingRankings = false;

        function init() {
            populateSeasons();
            populateTeams();
            setupEventListeners();
        }

        function populateSeasons() {
            const select = document.getElementById('yearSelect');
            for (let year = CONFIG.CURRENT_SEASON; year >= 2003; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = `${year - 1}-${year}`;
                select.appendChild(option);
            }
        }

        const TEAM_SELECT_IDS = ['team1Select', 'team2Select'];
        const teamListCache = {};

        // Fill team dropdowns, keeping any current selection that still exists
        function renderTeams(list) {
            TEAM_SELECT_IDS.forEach(id => {
                const select = document.getElementById(id);
                const previous = select.value;
                while (select.options.length > 1) select.remove(1);
                list.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team;
                    option.textContent = team;
                    select.appendChild(option);
                });
                if (previous && list.includes(previous)) select.value = previous;
            });
        }

        // Pull the season's team list from KenPom so names always match the API.
        // Falls back to the built-in list if the backend is asleep or the season isn't published yet.
        async function loadTeamsForSeason(year) {
            if (teamListCache[year]) return renderTeams(teamListCache[year]);
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/api/ratings/current?y=${year}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const names = [...new Set(data.map(t => t.TeamName).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b));
                if (names.length < 300) throw new Error(`only ${names.length} teams returned`);
                teamListCache[year] = names;
                renderTeams(names);
            } catch (err) {
                console.warn(`Team list for ${year} unavailable, using fallback:`, err.message);
            }
        }

        function populateTeams() {
            renderTeams(FALLBACK_TEAMS);
            loadTeamsForSeason(CONFIG.CURRENT_SEASON);
            document.getElementById('yearSelect').addEventListener('change', e => {
                const year = parseInt(e.target.value);
                if (year) loadTeamsForSeason(year);
            });
        }

        function setupEventListeners() {
            document.getElementById('compareBtn').addEventListener('click', compareTeams);
            document.getElementById('toggleBtn').addEventListener('click', toggleView);
        }

        function getSundaysInSeason(year) {
            const sundays = [];
            const startDate = new Date(year - 1, CONFIG.SEASON_START_MONTH, 1);
            const endDate = new Date(year, CONFIG.SEASON_END_MONTH, 31);
            
            let current = new Date(startDate);
            while (current.getDay() !== 0) {
                current.setDate(current.getDate() + 1);
            }
            
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            
            while (current <= Math.min(endDate, yesterday)) {
                sundays.push(new Date(current));
                current.setDate(current.getDate() + 7);
            }
            
            return sundays;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function compareTeams() {
            const team1 = document.getElementById('team1Select').value;
            const team2 = document.getElementById('team2Select').value;
            const year = parseInt(document.getElementById('yearSelect').value);
            
            if (!team1 || !team2) {
                showError('Please select both teams');
                return;
            }
            
            if (team1 === team2) {
                showError('Please select two different teams');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('resultsContainer').classList.remove('active');
            document.getElementById('compareBtn').disabled = true;
            
            try {
                const sundays = getSundaysInSeason(year);
                const team1Data = [];
                const team2Data = [];
                
                for (const sunday of sundays) {
                    const dateStr = formatDate(sunday);
                    const [data1, data2] = await Promise.all([
                        fetchKenPomData(dateStr, year, team1),
                        fetchKenPomData(dateStr, year, team2)
                    ]);
                    
                    if (data1) {
                        team1Data.push({ date: sunday, dateStr, ...data1 });
                    }
                    if (data2) {
                        team2Data.push({ date: sunday, dateStr, ...data2 });
                    }
                }
                
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = formatDate(yesterday);
                
                const [current1, current2] = await Promise.all([
                    fetchKenPomData(yesterdayStr, year, team1),
                    fetchKenPomData(yesterdayStr, year, team2)
                ]);
                
                if (current1) {
                    team1Data.push({ date: yesterday, dateStr: yesterdayStr, ...current1 });
                }
                if (current2) {
                    team2Data.push({ date: yesterday, dateStr: yesterdayStr, ...current2 });
                }
                
                if (team1Data.length === 0 || team2Data.length === 0) {
                    showError('No data found for one or both teams');
                    return;
                }
                
                currentData = { team1, team2, team1Data, team2Data, year };
                displayCharts();
                
            } catch (error) {
                console.error('Error:', error);
                showError(`Error: ${error.message}`);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('compareBtn').disabled = false;
            }
        }

        async function fetchKenPomData(date, year, team) {
            const url = `${CONFIG.BACKEND_URL}/api/team/${encodeURIComponent(team)}?date=${date}&year=${year}`;
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        return null;
                    }
                    throw new Error('Failed to fetch data');
                }
                
                const teamData = await response.json();
                
                return {
                    adjO: teamData.AdjOE,
                    adjD: teamData.AdjDE,
                    adjEM: teamData.AdjEM,
                    rankAdjO: teamData.RankAdjOE,
                    rankAdjD: teamData.RankAdjDE,
                    rankAdjEM: teamData.RankAdjEM
                };
                
            } catch (error) {
                console.warn(`Could not fetch data for ${date}:`, error.message);
                return null;
            }
        }

        function displayCharts() {
            if (!currentData) return;
            
            const { team1, team2, team1Data, team2Data } = currentData;
            
            const labels = team1Data.map(d => {
                const date = new Date(d.date);
                return `${date.getMonth() + 1}/${date.getDate()}`;
            });
            
            createChart('offenseChart', 'Adjusted Offense', labels, team1, team2, team1Data, team2Data, 'adjO', 'rankAdjO');
            createChart('defenseChart', 'Adjusted Defense', labels, team1, team2, team1Data, team2Data, 'adjD', 'rankAdjD');
            createChart('netRatingChart', 'Net Rating', labels, team1, team2, team1Data, team2Data, 'adjEM', 'rankAdjEM');
            
            document.getElementById('resultsContainer').classList.add('active');
            document.getElementById('toggleBtn').disabled = false;
        }

        function createChart(canvasId, title, labels, team1, team2, team1Data, team2Data, valueKey, rankKey) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }
            
            const datasets = showingRankings ? [
                {
                    label: team1,
                    data: team1Data.map(d => d[rankKey]),
                    borderColor: 'rgb(102, 126, 234)',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.3
                },
                {
                    label: team2,
                    data: team2Data.map(d => d[rankKey]),
                    borderColor: 'rgb(237, 100, 166)',
                    backgroundColor: 'rgba(237, 100, 166, 0.1)',
                    tension: 0.3
                }
            ] : [
                {
                    label: team1,
                    data: team1Data.map(d => d[valueKey]),
                    borderColor: 'rgb(102, 126, 234)',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.3
                },
                {
                    label: team2,
                    data: team2Data.map(d => d[valueKey]),
                    borderColor: 'rgb(237, 100, 166)',
                    backgroundColor: 'rgba(237, 100, 166, 0.1)',
                    tension: 0.3
                }
            ];
            
            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            reverse: showingRankings,
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function toggleView() {
            showingRankings = !showingRankings;
            document.getElementById('toggleBtn').textContent = 
                showingRankings ? 'Show Raw Values' : 'Show Rankings';
            document.getElementById('toggleBtn').classList.toggle('active');
            displayCharts();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        init();
    </script>
</body>
</html>
