<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenPom Season Trends</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation */
        .nav-container {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .nav-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-links a {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .nav-links a.active {
            background: #764ba2;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #333;
        }

        .secondary-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .secondary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn.active {
            background: #764ba2;
            color: white;
        }

        .help-text {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        .results-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

        .results-container.active {
            display: block;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .loading.active {
            display: block;
        }

        .error {
            display: none;
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .error.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .nav-container {
                padding: 15px;
            }

            .nav-title {
                font-size: 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                padding: 8px 15px;
                font-size: 14px;
            }
            
            .container {
                padding: 0;
            }
            
            .controls, .results-container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.8em;
                margin-bottom: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-value {
                font-size: 24px;
            }

            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="nav-container">
        <div class="nav-title">
            🏀 KenPom Metrics Viewer
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Season Trends</a>
            <a href="compare.html">Compare Teams</a>
            <a href="matchup.html">Matchup Builder</a>
            <a href="conference.html">Conference Odds</a>
            <a href="predictor.html">Matchup Predictor</a>
            <a href="bracket.html">Bracket</a>
        </div>
    </div>

    <div class="container">
        <h1>🏀 KenPom Season Trends</h1>

        <div class="controls">
            <div class="form-row">
                <div class="form-group">
                    <label for="teamSelect">Select Team:</label>
                    <select id="teamSelect">
                        <option value="">Choose a team...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="seasonSelect">Select Season:</label>
                    <select id="seasonSelect">
                        <option value="">Choose a season...</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button id="fetchBtn" class="primary-btn">Load Season Trends</button>
                <button id="toggleBtn" class="secondary-btn" disabled>Show Rankings</button>
            </div>

            <p class="help-text">
                Select a team and season, then click "Load Season Trends" to see weekly KenPom metrics throughout the season.
            </p>

            <div id="errorMessage" class="error"></div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>

        <div id="resultsContainer" class="results-container">
            <div id="statsSummary" class="stats-summary"></div>
            <div class="chart-container">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {

            CURRENT_SEASON: (() => { const now = new Date(); return now.getMonth() >= 9 ? now.getFullYear() + 1 : now.getFullYear(); })()  // KenPom uses ending year; rolls over Oct 1

            'Pepperdine', 'Pittsburgh', 'Portland', 'Portland St.', 'Prairie View A&M', 
            'Presbyterian', 'Princeton', 'Providence', 'Purdue', 'Purdue Fort Wayne', 
            'Queens', 'Quinnipiac', 'Radford', 'Rhode Island', 'Rice', 'Richmond', 
            'Rider', 'Robert Morris', 'Rutgers', 'Sacramento St.', 'Sacred Heart', 
            'Saint Joseph\'s', 'Saint Louis', 'Saint Mary\'s', 'Saint Peter\'s', 'Sam Houston St.', 
            'Samford', 'San Diego', 'San Diego St.', 'San Francisco', 'San Jose St.', 
            'Santa Clara', 'Seattle', 'Seton Hall', 'Siena', 'SMU', 'South Alabama',

            'South Dakota St.', 'South Florida', 'Southeast Missouri St.', 'Southeastern Louisiana', 
            'Southern', 'Southern Illinois', 'Southern Indiana', 'Southern Methodist', 
            'Southern Mississippi', 'Southern Utah', 'St. Bonaventure', 'St. Francis NY', 
            'St. Francis PA', 'St. John\'s', 'St. Thomas', 'Stanford', 'Stephen F. Austin', 
            'Stetson', 'Stonehill', 'Stony Brook', 'Syracuse', 'Tarleton St.', 'TCU', 
            'Temple', 'Tennessee', 'Tennessee Martin', 'Tennessee St.', 'Tennessee Tech', 
            'Texas', 'Texas A&M', 'Texas A&M Commerce', 'Texas A&M Corpus Chris', 'Texas Arlington', 
            'Texas Rio Grande Valley', 'Texas San Antonio', 'Texas Southern', 'Texas St.', 
            'Texas Tech', 'The Citadel', 'Toledo', 'Towson', 'Troy', 'Tulane', 'Tulsa', 
            'UAB', 'UCF', 'UCLA', 'UMass Lowell', 'UMBC', 'UNC Asheville', 'UNC Greensboro', 
            'UNC Wilmington', 'UNLV', 'USC', 'UT Martin', 'Utah', 'Utah St.', 'Utah Tech', 
            'Utah Valley', 'UTEP', 'Valparaiso', 'Vanderbilt', 'VCU', 'Vermont', 'Villanova', 
            'Virginia', 'Virginia Tech', 'VMI', 'Wagner', 'Wake Forest', 'Washington', 
            'Washington St.', 'Weber St.', 'West Virginia', 'Western Carolina', 'Western Illinois', 
            'Western Kentucky', 'Western Michigan', 'Wichita St.', 'William & Mary', 'Winthrop', 
            'Wisconsin', 'Wofford', 'Wright St.', 'Wyoming', 'Xavier', 'Yale', 'Youngstown St.'
        ];

        let currentChart = null;
        let currentData = null;
        let showingRankings = false;

        function init() {
            populateTeams();
            populateSeasons();
            setupEventListeners();
        }

        const TEAM_SELECT_IDS = ['teamSelect'];
        const teamListCache = {};

        // Fill team dropdowns, keeping any current selection that still exists
        function renderTeams(list) {
            TEAM_SELECT_IDS.forEach(id => {
                const select = document.getElementById(id);
                const previous = select.value;
                while (select.options.length > 1) select.remove(1);
                list.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team;
                    option.textContent = team;
                    select.appendChild(option);
                });
                if (previous && list.includes(previous)) select.value = previous;
            });
        }

        // Pull the season's team list from KenPom so names always match the API.
        // Falls back to the built-in list if the backend is asleep or the season isn't published yet.
        async function loadTeamsForSeason(year) {
            if (teamListCache[year]) return renderTeams(teamListCache[year]);
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/api/ratings/current?y=${year}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const names = [...new Set(data.map(t => t.TeamName).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b));
                if (names.length < 300) throw new Error(`only ${names.length} teams returned`);
                teamListCache[year] = names;
                renderTeams(names);
            } catch (err) {
                console.warn(`Team list for ${year} unavailable, using fallback:`, err.message);
            }
        }

        function populateTeams() {
            renderTeams(FALLBACK_TEAMS);
            loadTeamsForSeason(CONFIG.CURRENT_SEASON);
            document.getElementById('seasonSelect').addEventListener('change', e => {
                const year = parseInt(e.target.value);
                if (year) loadTeamsForSeason(year);
            });
        }

        function populateSeasons() {
            const select = document.getElementById('seasonSelect');
            for (let year = CONFIG.CURRENT_SEASON; year >= 2003; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = `${year - 1}-${year}`;
                select.appendChild(option);
            }
        }

        function setupEventListeners() {
            document.getElementById('fetchBtn').addEventListener('click', loadSeasonTrends);
            document.getElementById('toggleBtn').addEventListener('click', toggleView);
        }

        function getSundaysInSeason(year) {
            const sundays = [];
            const startDate = new Date(year - 1, CONFIG.SEASON_START_MONTH, 1);
            const endDate = new Date(year, CONFIG.SEASON_END_MONTH, 31);
            
            let current = new Date(startDate);
            while (current.getDay() !== 0) {
                current.setDate(current.getDate() + 1);
            }
            
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            
            while (current <= Math.min(endDate, yesterday)) {
                sundays.push(new Date(current));
                current.setDate(current.getDate() + 7);
            }
            
            return sundays;
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function loadSeasonTrends() {
            const team = document.getElementById('teamSelect').value;
            const year = parseInt(document.getElementById('seasonSelect').value);
            
            if (!team || !year) {
                showError('Please select both a team and a season.');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('resultsContainer').classList.remove('active');
            document.getElementById('fetchBtn').disabled = true;
            
            try {
                const sundays = getSundaysInSeason(year);
                const dataPoints = [];
                
                for (const sunday of sundays) {
                    const dateStr = formatDate(sunday);
                    const data = await fetchKenPomData(dateStr, year, team);
                    
                    if (data) {
                        dataPoints.push({
                            date: sunday,
                            dateStr: dateStr,
                            ...data
                        });
                    }
                }
                
                const latestData = await fetchCurrentRatings(year, team);
                if (latestData) {
                    const today = new Date();
                    dataPoints.push({
                        date: today,
                        dateStr: formatDate(today),
                        ...latestData
                    });
                }
                
                if (dataPoints.length === 0) {
                    showError('No data found for this team and season.');
                    return;
                }
                
                currentData = { team, year, dataPoints };
                displayChart();
                
            } catch (error) {
                console.error('Error:', error);
                showError(`Error: ${error.message}`);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('fetchBtn').disabled = false;
            }
        }

        async function fetchKenPomData(date, year, team) {
            const url = `${CONFIG.BACKEND_URL}/api/team/${encodeURIComponent(team)}?date=${date}&year=${year}`;
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        return null;
                    }
                    throw new Error('Failed to fetch data');
                }
                
                const teamData = await response.json();
                
                return {
                    adjO: teamData.AdjOE,
                    adjD: teamData.AdjDE,
                    adjEM: teamData.AdjEM,
                    rankAdjO: teamData.RankAdjOE,
                    rankAdjD: teamData.RankAdjDE,
                    rankAdjEM: teamData.RankAdjEM
                };
                
            } catch (error) {
                console.warn(`Could not fetch data for ${date}:`, error.message);
                return null;
            }
        }

        async function fetchCurrentRatings(year, team) {
            const url = `${CONFIG.BACKEND_URL}/api/ratings/current?y=${year}&team=${encodeURIComponent(team)}`;
            
            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    console.warn('Could not fetch current ratings');
                    return null;
                }
                
                const teamData = await response.json();
                
                return {
                    adjO: teamData.AdjOE,
                    adjD: teamData.AdjDE,
                    adjEM: teamData.AdjEM,
                    rankAdjO: teamData.RankAdjOE,
                    rankAdjD: teamData.RankAdjDE,
                    rankAdjEM: teamData.RankAdjEM
                };
                
            } catch (error) {
                console.warn('Error fetching current ratings:', error.message);
                return null;
            }
        }

        function displayChart() {
            if (!currentData || currentData.dataPoints.length === 0) {
                return;
            }
            
            const { team, dataPoints } = currentData;
            const latest = dataPoints[dataPoints.length - 1];
            const summary = document.getElementById('statsSummary');
            
            summary.innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Latest AdjO</div>
                    <div class="stat-value">${latest.adjO.toFixed(1)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Latest AdjD</div>
                    <div class="stat-value">${latest.adjD.toFixed(1)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Latest Net Rating</div>
                    <div class="stat-value">${latest.adjEM.toFixed(1)}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Overall Rank</div>
                    <div class="stat-value">#${latest.rankAdjEM}</div>
                </div>
            `;
            
            createChart();
            document.getElementById('resultsContainer').classList.add('active');
            
            const toggleBtn = document.getElementById('toggleBtn');
            if (toggleBtn) {
                toggleBtn.disabled = false;
            }
        }

        function createChart() {
            const ctx = document.getElementById('trendsChart').getContext('2d');
            const { team, dataPoints } = currentData;
            
            if (currentChart) {
                currentChart.destroy();
            }
            
            const labels = dataPoints.map(d => {
                const date = new Date(d.date);
                return `${date.getMonth() + 1}/${date.getDate()}`;
            });
            
            const datasets = showingRankings ? [
                {
                    label: 'Offensive Rank',
                    data: dataPoints.map(d => d.rankAdjO),
                    borderColor: 'rgb(102, 126, 234)',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.3
                },
                {
                    label: 'Defensive Rank',
                    data: dataPoints.map(d => d.rankAdjD),
                    borderColor: 'rgb(237, 100, 166)',
                    backgroundColor: 'rgba(237, 100, 166, 0.1)',
                    tension: 0.3
                },
                {
                    label: 'Overall Rank',
                    data: dataPoints.map(d => d.rankAdjEM),
                    borderColor: 'rgb(118, 75, 162)',
                    backgroundColor: 'rgba(118, 75, 162, 0.1)',
                    tension: 0.3
                }
            ] : [
                {
                    label: 'Adjusted Offense',
                    data: dataPoints.map(d => d.adjO),
                    borderColor: 'rgb(102, 126, 234)',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    tension: 0.3
                },
                {
                    label: 'Adjusted Defense',
                    data: dataPoints.map(d => d.adjD),
                    borderColor: 'rgb(237, 100, 166)',
                    backgroundColor: 'rgba(237, 100, 166, 0.1)',
                    tension: 0.3
                },
                {
                    label: 'Net Rating',
                    data: dataPoints.map(d => d.adjEM),
                    borderColor: 'rgb(118, 75, 162)',
                    backgroundColor: 'rgba(118, 75, 162, 0.1)',
                    tension: 0.3
                }
            ];
            
            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: `${team} - ${showingRankings ? 'Rankings' : 'Metrics'} Trend`,
                            font: {
                                size: 18,
                                weight: 'bold'
                            }
                        }
                    },
                    scales: {
                        y: {
                            reverse: showingRankings,
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        function toggleView() {
            showingRankings = !showingRankings;
            document.getElementById('toggleBtn').textContent = 
                showingRankings ? 'Show Raw Values' : 'Show Rankings';
            document.getElementById('toggleBtn').classList.toggle('active');
            createChart();
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        init();
    </script>
</body>
</html>
