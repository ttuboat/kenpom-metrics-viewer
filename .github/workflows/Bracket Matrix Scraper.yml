name: Daily Bracket Matrix Scraper

on:
  schedule:
    # Runs at 6 AM EST daily (10:00 UTC)
    - cron: '0 10 * * *'
  
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏀 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml html5lib
      
      - name: 🔍 Scrape Bracket Matrix
        run: |
          python scrape_bracket_matrix.py
      
      - name: 📊 Check if data changed
        id: check_changes
        run: |
          if git diff --quiet projected_seeds_2026.*; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in seed data"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Seed data has been updated!"
          fi
      
      - name: 💾 Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add projected_seeds_2026.csv projected_seeds_2026.json
          git commit -m "🤖 Auto-update: Bracket Matrix seeds ($(date +'%Y-%m-%d'))"
          git push
      
      - name: ✅ Summary
        run: |
          echo "================================"
          echo "Bracket Matrix Scraper Summary"
          echo "================================"
          if [ -f projected_seeds_2026.json ]; then
            echo "✓ Seeds file updated successfully"
            echo "📁 Files created:"
            ls -lh projected_seeds_2026.*
          else
            echo "⚠️ No seed files found"
          fi
      
      - name: 📤 Upload artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: seed-data
          path: |
            projected_seeds_2026.csv
            projected_seeds_2026.json
          retention-days: 7
